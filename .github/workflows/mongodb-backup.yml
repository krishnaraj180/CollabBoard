name: MongoDB backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production-backups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci --omit=dev
      - name: Install MongoDB Database Tools
        run: |
          curl --fail --silent --show-error --location \
            https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.12.2.tgz \
            --output /tmp/mongodb-tools.tgz
          tar -xzf /tmp/mongodb-tools.tgz -C /tmp
          echo "/tmp/mongodb-database-tools-ubuntu2204-x86_64-100.12.2/bin" >> "$GITHUB_PATH"
      - name: Create compressed backup
        working-directory: server
        env:
          MONGODB_URI: ${{ secrets.PRODUCTION_MONGODB_URI }}
          BACKUP_DIR: ${{ github.workspace }}/backup-output
        run: npm run backup:mongodb
      - name: Retain backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: collabboard-mongodb-${{ github.run_id }}
          path: backup-output/*.archive.gz
          retention-days: 30
